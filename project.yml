name: BurningParchment
options:
  bundleIdPrefix: com.burningparchment
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  # 개발 지역은 en: 지원하지 않는 언어(일본어 등) 사용자가 한국어 대신 영어를 본다.
  # String Catalog 의 sourceLanguage 는 ko 이고, 앱·위젯 카탈로그에 ko 항목을
  # 명시해 두었으므로 빌드 산출물에 ko.lproj 가 생겨 한국어 기기는 한국어로 뜬다.
  # (ko 항목이 하나도 없으면 ko.lproj 가 안 생겨 한국어 기기가 en 을 고른다 — faea19a)
  developmentLanguage: en

# 버전·빌드번호의 단일 소스. 프로젝트 레벨 baseConfiguration 이라
# 앱·위젯 두 타겟이 같은 값을 쓴다. 아래 타겟 설정에 MARKETING_VERSION 을
# 다시 적으면 그쪽이 이 파일을 이겨 버리므로 적지 말 것.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: 3.26.0

schemes:
  BurningParchment:
    build:
      targets:
        BurningParchment: all
        BurningParchmentWidgets: all
    run:
      config: Debug
      # 시뮬레이터에서 프로 구매·취소·복원을 실제 App Store 없이 시험한다 (Debug 실행에만 쓰인다).
      # 가격은 시험용이다 — 실제 가격은 App Store Connect 의 com.burningparchment.app.pro 를 따른다.
      storeKitConfiguration: Config/BurningParchment.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BurningParchmentTests
        - BurningParchmentUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BurningParchmentWidgets:
    build:
      targets:
        BurningParchmentWidgets: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  BurningParchment:
    type: application
    platform: iOS
    sources:
      - path: BurningParchment
        excludes:
          - "**/.DS_Store"
    info:
      path: BurningParchment/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad 는 어느 방향으로 들어도 바로 선다. 아이폰 전용이던 때는 가로로 든 iPad 에서 90도 돌아간 채 열렸다
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        CFBundleDisplayName: "Burning Parchment"
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "취침 30분 전, 양피지에 후 불어 불을 끌 때 입김의 세기만 확인합니다. 소리는 녹음하거나 저장하지 않습니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: BurningParchment/BurningParchment.entitlements
    dependencies:
      - target: BurningParchmentWidgets
      - package: LeeoKit

  BurningParchmentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BurningParchmentWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: BurningParchment/Models/BedtimeActivityAttributes.swift
      - path: BurningParchment/Models/Deadline.swift
      - path: BurningParchment/Models/TimeFormat.swift
    info:
      path: BurningParchmentWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Burning Parchment"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app.widgets
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: BurningParchmentWidgets/BurningParchmentWidgets.entitlements

  # 단위 시험 — 핵심 판단(데드라인·회고 분류·처음 온 사람·퍼널)과 계약(LeeoPreflight)
  BurningParchmentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BurningParchmentTests
    dependencies:
      - target: BurningParchment
      - package: LeeoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BurningParchment.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BurningParchment"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI 시험 — 핵심 흐름 한 바퀴 + 접근성 감사
  BurningParchmentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BurningParchmentUITests
    dependencies:
      - target: BurningParchment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BurningParchment
