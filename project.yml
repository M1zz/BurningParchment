name: BurningParchment
options:
  bundleIdPrefix: com.burningparchment
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  # String Catalog 의 sourceLanguage 가 ko 다. 이 값이 en 이면 한국어 기기에서도
  # 개발 지역(en) 리소스가 선택돼 앱·위젯이 영어로 뜬다.
  developmentLanguage: ko

# 버전·빌드번호의 단일 소스. 프로젝트 레벨 baseConfiguration 이라
# 앱·위젯 두 타겟이 같은 값을 쓴다. 아래 타겟 설정에 MARKETING_VERSION 을
# 다시 적으면 그쪽이 이 파일을 이겨 버리므로 적지 말 것.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: 3.2.0

schemes:
  BurningParchment:
    build:
      targets:
        BurningParchment: all
        BurningParchmentWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BurningParchmentWidgets:
    build:
      targets:
        BurningParchmentWidgets: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  BurningParchment:
    type: application
    platform: iOS
    sources:
      - path: BurningParchment
        excludes:
          - "**/.DS_Store"
    info:
      path: BurningParchment/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ko
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: "불타는 내인생"
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: BurningParchment/BurningParchment.entitlements
    dependencies:
      - target: BurningParchmentWidgets
      - package: LeeoKit

  BurningParchmentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BurningParchmentWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: BurningParchment/Models/BedtimeActivityAttributes.swift
      - path: BurningParchment/Models/Deadline.swift
      - path: BurningParchment/Models/TimeFormat.swift
    info:
      path: BurningParchmentWidgets/Info.plist
      properties:
        CFBundleDisplayName: BurningParchmentWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burningparchment.app.widgets
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: BurningParchmentWidgets/BurningParchmentWidgets.entitlements
